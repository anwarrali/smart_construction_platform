services:
  db:
    image: postgres:15
    container_name: Construction_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Const@2233}
      POSTGRES_DB: ${POSTGRES_DB:-construction_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: construction_backend
    restart: always
    volumes:
      - uploads_data:/app/uploads
      # Private voice and IFC source files; never served by the public upload mount.
      - voice_audio_data:/app/private_uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URLENCODED:-Const%402233}@db:5432/${POSTGRES_DB:-construction_platform}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      PYTHONUNBUFFERED: 1
    networks:
      - app-network
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: construction_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app-network

  flutter-tools:
    profiles:
      - mobile-tools
    build:
      context: ./mobile_app
      dockerfile: Dockerfile.ci
      args:
        FLUTTER_VERSION: "3.32.2"
    working_dir: /app
    volumes:
      - ./mobile_app:/app
      - flutter-pub-cache:/home/flutterci/.pub-cache
      - flutter-gradle-cache:/home/flutterci/.gradle
      # Keep Linux package metadata and project Gradle state away from the
      # developer's host Flutter/Android toolchain.
      - flutter-dart-tool:/app/.dart_tool
      - flutter-android-project-cache:/app/android/.gradle
    environment:
      PUB_CACHE: /home/flutterci/.pub-cache
      GRADLE_USER_HOME: /home/flutterci/.gradle
      ANDROID_KEYSTORE_PATH: ${ANDROID_KEYSTORE_PATH:-}
      ANDROID_KEYSTORE_PASSWORD: ${ANDROID_KEYSTORE_PASSWORD:-}
      ANDROID_KEY_ALIAS: ${ANDROID_KEY_ALIAS:-}
      ANDROID_KEY_PASSWORD: ${ANDROID_KEY_PASSWORD:-}
    command: flutter --version

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  voice_audio_data:
  flutter-pub-cache:
  flutter-gradle-cache:
  flutter-dart-tool:
  flutter-android-project-cache:
