<!--
  StructIQ app icon.

  At favicon size the outline lockup loses its counters, so the icon form is the
  solid one: the chamfered structural frame reversed out of Architectural Navy,
  with the connection tail in Verdant. Same geometry as StructIQMark, scaled and
  centred on the tile.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7.2" fill="#10233F"/>
  <g transform="translate(4.9 5.5) scale(0.66)" fill="none">
    <path d="M10.5 2.6 H17.5 L24.4 9.5 V16.5 L17.5 23.4 H10.5 L3.6 16.5 V9.5 Z"
          stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#4E8B5C" stroke-linecap="round">
      <path d="M21.7 20.7 L23.1 22.1" stroke-width="3"/>
      <circle cx="25.1" cy="24.1" r="1.85" stroke-width="1.6"/>
      <path d="M27.1 26.1 L27.9 26.9" stroke-width="3"/>
      <circle cx="29" cy="28" r="2.6" fill="#4E8B5C" stroke="none"/>
    </g>
  </g>
</svg>
