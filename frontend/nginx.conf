server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # --- Caching -----------------------------------------------------------
    #
    # Two rules, and they only make sense together.
    #
    # Vite writes every JS and CSS file into /assets/ with a content hash in
    # its name, so a file at a given URL can never change: different bytes get
    # a different name. Those are safe to cache forever, and `immutable` tells
    # the browser not to even revalidate them.
    #
    # `index.html` is the one file whose URL stays the same across deploys —
    # it is what names the current hashed bundle. Served with no explicit
    # Cache-Control, browsers fall back to heuristic caching from
    # Last-Modified, which after a deploy leaves them loading the *previous*
    # bundle for however long the heuristic decides. (Observed: a rebuilt
    # container serving the new files while the browser kept running the old
    # ones.) `no-cache` does not mean "do not store" — it means "revalidate
    # before use", so the usual response is a 304 on a file of a few hundred
    # bytes, and a deploy is picked up on the next navigation.
    #
    # The service worker gets the same treatment. Modern browsers bypass the
    # HTTP cache when checking a worker for updates, but not all do, and a
    # stale worker means push notifications keep running last week's handler.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Every other path is a client-side route, answered with index.html. The
    # internal redirect re-runs location matching, so those responses pick up
    # the `no-cache` above rather than this block's (absent) headers.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
